name: Build and safety tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build WPF application
        run: dotnet build src/KnightsCleaner.App/KnightsCleaner.App.csproj -c Release
      - name: Run isolated cleanup safety tests
        run: dotnet run --project tests/KnightsCleaner.Tests -c Release
      - name: Smoke test WPF window without cleaning
        run: dotnet run --project tests/KnightsCleaner.UiTests -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: KnightsCleaner-preview
          path: artifacts/KnightsCleaner-preview.png
      - name: Publish Windows x64 application
        run: dotnet publish src/KnightsCleaner.App -c Release -r win-x64 --self-contained true -o artifacts/KnightsCleaner
      - uses: actions/upload-artifact@v4
        with:
          name: KnightsCleaner-win-x64
          path: artifacts/KnightsCleaner
      - name: Package download
        run: Compress-Archive -Path artifacts/KnightsCleaner/* -DestinationPath artifacts/KnightsCleaner-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KnightsCleaner-download
          path: artifacts/KnightsCleaner-win-x64.zip
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KnightsCleaner-download
          path: release
      - name: Publish first script-conversion preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release view v0.2.0 --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output "Release already exists; keeping its published files."; exit 0 }
          gh release create v0.2.0 release/KnightsCleaner-win-x64.zip --repo $env:GH_REPO --target $env:GITHUB_SHA --title "Knights Cleaner 0.2.0" --prerelease --notes "Desktop conversion of Start_up_Cleaner.bat. Download the ZIP, extract all files, and run KnightsCleaner.exe. Includes Temp, Prefetch, Event Logs and Windows Update options. Advanced actions require administrator access and confirmation. Build, isolated cleanup tests, service rollback tests and UI startup checks pass; real update resets and event-log deletion are not exercised in CI."
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
